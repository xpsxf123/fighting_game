<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>大蜀国物语 S1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #3E2723;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, sans-serif;
    }
    #wrap {
      width: 100%; height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: #FFF8E1;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: absolute; left: 0; right: 0; top: 0;
      pointer-events: none;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      padding-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>
  <script src="js/game-core.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var wrap = document.getElementById('wrap');

      function size() {
        var w = wrap.clientWidth;
        var h = wrap.clientHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        return { w: w, h: h, dpr: dpr };
      }

      var s = size();
      var game = DashuS1.createGame({
        canvas: canvas,
        width: s.w,
        height: s.h,
        dpr: s.dpr,
        assetBase: 'assets/'
      });

      window.addEventListener('resize', function () {
        var n = size();
        game.resize(n.w, n.h, n.dpr);
      });

      function pos(e) {
        var rect = canvas.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
        return {
          x: (t.clientX - rect.left) * (s.w / rect.width),
          y: (t.clientY - rect.top) * (s.h / rect.height)
        };
      }
      // 用当前尺寸比例
      function pos2(e) {
        var rect = canvas.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
        var n = size();
        return {
          x: (t.clientX - rect.left) / rect.width * n.w,
          y: (t.clientY - rect.top) / rect.height * n.h
        };
      }

      canvas.addEventListener('mousedown', function (e) {
        var p = pos2(e); game.pointerDown(p.x, p.y);
      });
      window.addEventListener('mousemove', function (e) {
        var p = pos2(e); game.pointerMove(p.x, p.y);
      });
      window.addEventListener('mouseup', function (e) {
        var p = pos2(e); game.pointerUp(p.x, p.y);
      });
      var pinchDist0 = null;
      var pinchZoom0 = 1;

      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        if (e.touches.length === 2) {
          var a = pos2({ touches: [e.touches[0]] });
          var b = pos2({ touches: [e.touches[1]] });
          pinchDist0 = Math.hypot(a.x - b.x, a.y - b.y);
          pinchZoom0 = game.getZoom ? game.getZoom() : 1;
          return;
        }
        pinchDist0 = null;
        var p = pos2(e);
        game.pointerDown(p.x, p.y);
      }, { passive: false });
      canvas.addEventListener('touchmove', function (e) {
        e.preventDefault();
        if (e.touches.length === 2 && pinchDist0 && game.zoomAt) {
          var a = pos2({ touches: [e.touches[0]] });
          var b = pos2({ touches: [e.touches[1]] });
          var dist = Math.hypot(a.x - b.x, a.y - b.y);
          game.zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinchZoom0 * (dist / pinchDist0));
          return;
        }
        if (e.touches.length === 1) {
          var p = pos2(e);
          game.pointerMove(p.x, p.y);
        }
      }, { passive: false });
      canvas.addEventListener('touchend', function (e) {
        e.preventDefault();
        if (e.touches.length < 2) pinchDist0 = null;
        if (!e.touches.length) {
          var p = pos2(e);
          game.pointerUp(p.x, p.y);
        }
      }, { passive: false });
      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        var p = pos2(e);
        if (game.wheel) game.wheel(p.x, p.y, e.deltaY);
      }, { passive: false });

      game.start();
    })();
  </script>
</body>
</html>
